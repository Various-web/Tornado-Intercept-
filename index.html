<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>TORNADO INTERCEPTOR — Этап разработки</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --panel: #151518;
      --panel2: #1c1c21;
      --text: #f3f3f4;
      --muted: #a5a5ad;
      --red: #e32636;
      --line: #303037;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 85% 0%, rgba(227,38,54,.16), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }
    /* Декоративные световые элементы */
    .ambient {
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(90px);
      opacity: .13;
      z-index: -1;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .ambient.one { background: #e32636; top: 12%; left: -190px; }
    .ambient.two { background: #8d101d; right: -210px; bottom: 4%; animation-delay: -5s; }
    @keyframes drift {
      from { transform: translate3d(0, -18px, 0) scale(.92); }
      to { transform: translate3d(35px, 28px, 0) scale(1.12); }
    }
    .page { width: min(900px, 100%); margin: 0 auto; }
    header {
      padding: 30px;
      border: 1px solid var(--line);
      border-top: 4px solid var(--red);
      border-radius: 16px;
      background: linear-gradient(135deg, #19191d, #101013);
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
      position: relative;
      overflow: hidden;
      animation: header-in .85s cubic-bezier(.2,.8,.2,1) both;
    }
    header::after {
      content: "";
      position: absolute;
      top: -70%;
      left: -45%;
      width: 35%;
      height: 240%;
      transform: rotate(24deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
      animation: scan 7s ease-in-out 1.2s infinite;
      pointer-events: none;
    }
    @keyframes scan {
      0%, 55% { left: -45%; }
      100% { left: 130%; }
    }
    @keyframes header-in {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .eyebrow {
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    h1 { margin: 10px 0 8px; font-size: clamp(28px, 5vw, 43px); line-height: 1.12; }
    .subtitle { color: var(--muted); margin: 0; }
    .meta {
      display: flex; flex-wrap: wrap; gap: 9px; margin-top: 22px;
    }
    .chip {
      border: 1px solid var(--line);
      background: #202025;
      color: #dddde1;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 13px;
    }
    main { display: grid; gap: 15px; margin-top: 18px; }
    section {
      padding: 23px 25px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(21,21,24,.96);
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .65s ease, transform .65s cubic-bezier(.2,.8,.2,1), border-color .25s ease, box-shadow .25s ease;
    }
    section.visible { opacity: 1; transform: translateY(0); }
    section:hover {
      border-color: rgba(227,38,54,.45);
      box-shadow: 0 10px 28px rgba(0,0,0,.2);
    }
    h2 { margin: 0 0 12px; font-size: 20px; }
    h2 .emoji { margin-right: 8px; }
    p { margin: 0 0 10px; }
    p:last-child { margin-bottom: 0; }
    ul, ol { margin: 8px 0 0; padding-left: 22px; }
    li { padding: 3px 0; }
    li::marker { color: var(--red); }
    strong { color: #fff; }
    .progress-card {
      border-color: rgba(227,38,54,.55);
      background: linear-gradient(135deg, rgba(227,38,54,.12), #151518 58%);
    }
    .progress-top {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .percent { color: var(--red); font-size: 42px; font-weight: 900; line-height: 1; }
    .track {
      height: 12px; margin: 17px 0 12px; overflow: hidden;
      border-radius: 99px; background: #303037;
    }
    .fill {
      width: 98%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #a91020, #f04452);
      box-shadow: 0 0 18px rgba(227,38,54,.35);
      transform-origin: left;
      animation: progress-fill 1.8s cubic-bezier(.2,.8,.2,1) .45s both;
    }
    @keyframes progress-fill {
      from { width: 0; }
      to { width: 98%; }
    }
    .percent { text-shadow: 0 0 22px rgba(227,38,54,.28); }
    .note { color: var(--muted); font-size: 13px; }
    .community-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #19191d, #111114);
    }
    .community-card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -90px;
      top: -110px;
      border-radius: 50%;
      background: rgba(227,38,54,.12);
      filter: blur(28px);
      pointer-events: none;
    }
    .community-intro { color: var(--muted); margin-bottom: 18px; }
    .social-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      position: relative;
    }
